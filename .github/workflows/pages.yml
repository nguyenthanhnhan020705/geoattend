name: Publish GeoAttend frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check static artifact
        run: python -m unittest tests.test_pages_artifact -v
      - name: Build public frontend
        env:
          GEOATTEND_API_ORIGIN: ${{ vars.GEOATTEND_API_ORIGIN }}
          BUILD_VERSION: ${{ github.sha }}
        run: >-
          python -m scripts.build_pages
          --output _site --base-path /geoattend/
          --api-origin "$GEOATTEND_API_ORIGIN" --version "$BUILD_VERSION"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
