<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nộp báo cáo tuần · GeoAttend</title><link rel="stylesheet" href="/static/css/app.css"><link rel="stylesheet" href="/static/css/reports.css"><script type="module" src="/static/js/user-weekly-reports.js"></script></head><body>
<header class="topbar report-topbar"><a class="brand" href="/user"><span class="brand-mark">G</span>GeoAttend</a><nav aria-label="Điều hướng"><a href="/user">Chấm công</a><a href="/account">Đổi mật khẩu</a><a href="/user/weekly-reports" aria-current="page">NỘP BÁO CÁO TUẦN</a><button id="logout" class="text-button">Đăng xuất</button></nav></header>
<main class="workspace report-workspace"><div class="page-heading"><div><span class="eyebrow green">BÁO CÁO CÔNG VIỆC</span><h1>Nộp báo cáo tuần</h1><p class="muted">Tổng hợp toàn bộ nội dung trong tuần vào một file PDF.</p></div><button id="reload-reports" class="secondary" type="button">Tải lại</button></div>
<div data-report-notices aria-live="polite"></div><p id="notice-error" class="message" role="status"></p>
<section class="panel"><h2 id="report-week">Đang tải tuần báo cáo…</h2><p id="report-deadline" class="muted"></p><div id="current-report" class="report-current"></div>
<form id="report-form"><label for="report-file">File PDF báo cáo tuần</label><input id="report-file" type="file" accept=".pdf,application/pdf" required disabled aria-describedby="report-file-help"><p id="report-file-help" class="muted">Một PDF mỗi tuần, tối đa 10 MB. Có thể thay thế trước khi hết Chủ nhật. Tuần cũ chỉ được xem/tải.</p><p id="selected-file" class="muted"></p><button id="submit-report" type="submit" class="primary" disabled>Nộp báo cáo</button></form>
<button id="retry-report" class="secondary" type="button" hidden>Gửi lại báo cáo</button><p id="report-message" class="message" role="status" aria-live="polite"></p></section>
<section class="panel"><h2>Báo cáo đã nộp</h2><ul id="report-history" class="report-list"></ul><p id="history-message" class="message" role="status"></p><div class="pagination"><button id="history-prev" class="secondary" type="button">Trang trước</button><span id="history-page"></span><button id="history-next" class="secondary" type="button">Trang sau</button></div></section>
</main></body></html>
