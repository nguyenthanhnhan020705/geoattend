<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · GeoAttend</title><link rel="stylesheet" href="/static/css/app.css"><script type="module" src="/static/js/login.js"></script></head>
<body class="login-page"><main class="login-layout">
<section class="intro"><a class="brand" href="/login"><span class="brand-mark">G</span>GeoAttend</a><div class="intro-copy"><span class="eyebrow">LÀM VIỆC LINH HOẠT</span><h1>Mỗi ngày làm việc,<br>một kết nối rõ ràng.</h1><p>Không gian làm việc có thể thay đổi.<br>Thông tin luôn ở cùng một nơi.</p></div><span class="intro-footer">Văn phòng · Từ xa · Cùng một đội ngũ</span></section>
<section class="login-panel"><div class="login-card"><span class="eyebrow green">CHÀO MỪNG TRỞ LẠI</span><h2>Đăng nhập</h2><p class="muted">Sử dụng tài khoản được Admin cấp cho bạn.</p>
<form id="login-form"><label for="username">Tên tài khoản</label><input id="username" name="username" autocomplete="username" required maxlength="50" autofocus><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button type="submit" class="primary">Đăng nhập <span aria-hidden="true">→</span></button><p id="message" class="message" role="status" aria-live="polite"></p></form>
<p class="help">Quên mật khẩu? Liên hệ Admin để được cấp lại.</p></div></section>
</main></body></html>
