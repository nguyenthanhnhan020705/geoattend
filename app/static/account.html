<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đổi mật khẩu · GeoAttend</title><link rel="stylesheet" href="/static/css/app.css"><script type="module" src="/static/js/account.js"></script></head><body>
<header class="topbar"><a id="home" class="brand" href="/user"><span class="brand-mark">G</span>GeoAttend</a><nav aria-label="Điều hướng"><a id="back" href="/user">Quay lại</a><button id="logout" class="text-button">Đăng xuất</button></nav></header>
<main class="workspace narrow"><span class="eyebrow green">TÀI KHOẢN CÁ NHÂN</span><h1>Đổi mật khẩu</h1><p class="muted">Sau khi đổi thành công, hãy đăng nhập lại trên các thiết bị của bạn.</p><section class="panel"><form id="password-form"><label for="current-password">Mật khẩu hiện tại</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" required maxlength="128"><label for="new-password">Mật khẩu mới</label><input id="new-password" name="new_password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="password-help"><small id="password-help">Từ 8 đến 128 ký tự.</small><label for="confirm-password">Nhập lại mật khẩu mới</label><input id="confirm-password" name="confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><button type="submit" class="primary">Lưu mật khẩu mới</button><p id="message" class="message" role="status" aria-live="polite"></p></form></section></main></body></html>
